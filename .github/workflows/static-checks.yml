# main 정적 게이트: org 재사용 워크플로우(rn-static-checks) 호출.
# public repo이므로 러너는 ubuntu-latest(ARC 금지). 무거운 배포는 deploy.yaml이 담당.
name: Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      package_manager: npm
      node_version: '24.16.0'
      check_command: |
        npm run check
        npm run build
