name: Verify and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
      - name: Checkout development policy
        uses: actions/checkout@v6
        with:
          repository: seorilabs/.github
          ref: main
          path: .development-policy
      - name: Install verifier dependencies
        run: npm ci --prefix .development-policy --ignore-scripts --no-audit
      - name: Verify development evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .development-policy/scripts/release/verify-development-evidence.mjs --repo "$GITHUB_REPOSITORY" --tag development-evidence --sha "$GITHUB_SHA" --target web --phase before-deploy
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
